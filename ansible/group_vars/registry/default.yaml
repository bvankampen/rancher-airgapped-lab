---
# Directories and files for standalone RKE2 Rancher Cluster installation
rancher_directories:
  - "/etc/rancher/rke2"
  - "/var/lib/rancher/rke2/server/manifests"

rancher_files:
  - src: "config.yaml.j2"
    dest: "/etc/rancher/rke2/config.yaml"
  - src: "rancher-psact.yaml.j2"
    dest: "/etc/rancher/rke2/rancher-psact.yaml"
  - src: "registries-intermediate.yaml.j2"
    dest: "/etc/rancher/rke2/registries.yaml"
  - src: "rke2-cilium-config.yaml.j2"
    dest: "/var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml"

# Configuration variables for RKE2 Rancher Cluster installation
rancher_loadbalancer: registry-test.lab.suse
rancher_clustername: "registry-test"
rancher_loadbalancer_forall: true
rancher_tls_san_hostname: registry-test.lab.suse
rancher_rke2_token: changethistoarandomvalue
rancher_cni: cilium
rancher_cis_profile: cis
rancher_selinux: true

rancher_rke2_version: v1.36.5+rke2r1

lpp_selinux_data_dir: "/var/lib/rancher/data"
lpp_selinux_type: "container_file_t"
