      hosts:
        lab-rancher-1:
          ansible_host: 192.168.98.11
          first_rancher_node: true
        lab-rancher-2:
          ansible_host: 192.168.98.12
        lab-rancher-3:
          ansible_host: 192.168.98.13
    cluster:
      children:
        control_plane:
