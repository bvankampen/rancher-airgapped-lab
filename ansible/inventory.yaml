            lab-control-plane-2:
              ansible_host: 192.168.98.22
            lab-control-plane-3:
              ansible_host: 192.168.98.23
        worker:
          hosts:
            lab-worker-1:
              ansible_host: 192.168.98.31
            lab-worker-2:
              ansible_host: 192.168.98.32
            lab-worker-3:
              ansible_host: 192.168.98.33
    registry:
      hosts:
        lab-registry:
          ansible_host: 192.168.98.41
