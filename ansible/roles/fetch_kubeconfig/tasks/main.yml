---
- name: "Fetch kubeconfig"
  become: true
  ansible.builtin.fetch:
    src: "{{ fetch_kubeconfig_remote_path }}"
    dest: "{{ fetch_kubeconfig_dest }}"
    flat: true

- name: "Update IP in fetched kubeconfig"
  ansible.builtin.replace:
    path: "{{ fetch_kubeconfig_dest }}"
    regexp: '127\.0\.0\.1'
    replace: "{{ fetch_kubeconfig_first_node_ip }}"
  delegate_to: localhost

- name: "Update context name in fetched kubeconfig"
  ansible.builtin.replace:
    path: "{{ fetch_kubeconfig_dest }}"
    regexp: '(?ms)(contexts:\s*-\s*context:.*?name:\s*)default'
    replace: '\g<1>{{ fetch_kubeconfig_cluster_name }}'
  delegate_to: localhost

- name: "Update current-context in fetched kubeconfig"
  ansible.builtin.replace:
    path: "{{ fetch_kubeconfig_dest }}"
    regexp: "^current-context: .*"
    replace: "current-context: {{ fetch_kubeconfig_cluster_name }}"
  delegate_to: localhost
