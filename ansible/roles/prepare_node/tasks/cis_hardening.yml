---
- name: "Harden etcd"
  block:
    - name: "Create etcd group"
      ansible.builtin.group:
        name: etcd
        system: true
        state: present
    - name: "Create etcd user"
      ansible.builtin.user:
        name: etcd
        group: etcd
        shell: /sbin/nologin
        system: true
        create_home: false
        comment: etcd user
        state: present
    - name: "Harden etcd : set ownership"
      ansible.builtin.file:
        path: /var/lib/rancher/rke2/server/db/etcd
        owner: etcd
        group: etcd
        mode: 0700
        state: directory
  when: "'rancher' in group_names or is_server | default(false) or 'control_plane' in group_names"

- name: "Create RKE2 CIS sysctl configuration"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-rke2-cis.conf
    mode: 0644
    owner: root
    group: root
    content: |
      # RKE2 CIS sysctl configuration
      vm.panic_on_oom=0
      vm.overcommit_memory=1
      kernel.panic=10
      kernel.panic_on_oops=1
      net.ipv4.conf.all.forwarding=1
      net.ipv6.conf.all.forwarding=1
  register: rke2_cis_sysctl
  changed_when: rke2_cis_sysctl is changed

- name: "Reload sysctl configuration"
  ansible.builtin.command: sysctl --system
  register: sysctl_reload
  when: rke2_cis_sysctl is changed
