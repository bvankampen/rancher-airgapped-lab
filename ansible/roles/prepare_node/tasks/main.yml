- name: "CIS Hardening"
  ansible.builtin.include_tasks: cis_hardening.yml

- name: "Config Node"
  ansible.builtin.include_tasks: config.yml

- name: "Configure Firewall"
  ansible.builtin.include_tasks: firewall.yml
