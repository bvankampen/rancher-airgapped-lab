- name: "Create files and directories"
  ansible.builtin.include_tasks: files.yml
  when: "'rancher' in group_names or 'registry' in group_names"

- name: "Copy RKE2 installation files"
  ansible.builtin.include_tasks: copy_artefacts.yml
