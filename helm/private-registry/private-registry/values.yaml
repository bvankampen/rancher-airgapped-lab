global:
  imagePullSecrets:
    - suse-registry
expose:
  type: ingress
  ingress:
    className: traefik
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"
      ingress.kubernetes.io/proxy-body-size: "0"
    hosts:
      core: registry-test.lab.suse
  tls:
    certSource: secret
    secret:
      # The name of secret which contains keys named:
      # "tls.crt" - the certificate
      # "tls.key" - the private key
      secretName: "tls-registry-test"
caSecretName: "tls-ca"
externalURL: https://registry-test.lab.suse
harborAdminPassword: "Harbor12345"
persistence:
  registry:
    storageClass: local-path
    size: 150Gi
  jobservice:
    jobLog:
      storageClass: local-path
      size: 5Gi
  database:
    storageClass: local-path
    size: 10Gi
  redis:
    storageClass: local-path
    size: 10Gi
  trivy:
    storageClass: local-path
    size: 5Gi

core:
  quotaUpdateProvider: redis

database:
  maxOpenConns: 50
  maxIdleConns: 10
